
<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>

<body>

    <h2>Login to Your Account</h2>

    <form method="POST" action="/login">

        <input type="email"
               name="email"
               placeholder="Enter Email"
               required>

        <br><br>

        <input type="password"
               name="password"
               placeholder="Enter Password"
               required>

        <br><br>

        <button type="submit">Login</button>

    </form>

    <p>
        Don't have an account?
        <a href="/signup">Create Account</a>
    </p>

</body>
</html>
