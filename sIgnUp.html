
<!DOCTYPE html>
<html>
<head>
    <title>Sign Up</title>
</head>

<body>

    <h2>Create Account</h2>

    <form method="POST" action="/signup">

        <input type="text"
               name="name"
               placeholder="Enter Name"
               required>
        <br><br>

        <input type="email"
               name="email"
               placeholder="Enter Email"
               required>
        <br><br>

        <input type="password"
               name="password"
               placeholder="Enter Password"
               required>
        <br><br>

        <button type="submit">Sign Up</button>

    </form>

    <p>
        Already registered?
        <a href="/login">Login</a>
    </p>

</body>
</html>
